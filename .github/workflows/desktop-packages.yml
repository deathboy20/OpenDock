name: Desktop packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  packages:
    name: Packages (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            bundles: nsis,msi
            target: native
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: appimage,deb,rpm
            target: native
            deb_arch: amd64
            rpm_arch: x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            bundles: appimage,deb,rpm
            target: native
            deb_arch: arm64
            rpm_arch: aarch64
          - platform: macos-universal
            runner: macos-latest
            bundles: app
            target: universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install universal macOS Rust targets
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check package collector and release notes
        run: node --test scripts/collect-packages.test.mjs scripts/package-paths.test.mjs scripts/release-notes.test.mjs
      - name: Build Windows and Linux packages
        if: matrix.target == 'native'
        run: pnpm --filter @opendock/desktop tauri build --bundles ${{ matrix.bundles }} -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Build universal macOS app
        if: matrix.target == 'universal-apple-darwin'
        run: pnpm --filter @opendock/desktop tauri build --target universal-apple-darwin --bundles app -- --locked
      - name: Verify universal macOS app architectures
        if: matrix.platform == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/$executable")"
          [[ " $architectures " == *' arm64 '* && " $architectures " == *' x86_64 '* ]]
      - name: Sign universal macOS app when credentials are available
        id: macos-signing
        if: matrix.platform == 'macos-universal'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" || -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cert_path="$RUNNER_TEMP/opendock-signing.p12"
          keychain_path="$RUNNER_TEMP/opendock-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$cert_path"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          app_path="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app_path"
          codesign --verify --deep --strict "$app_path"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Build macOS DMG from the universal app
        if: matrix.platform == 'macos-universal'
        run: pnpm --filter @opendock/desktop tauri bundle --target universal-apple-darwin --bundles dmg --no-sign
      - name: Notarize macOS DMG when signing is enabled
        if: matrix.platform == 'macos-universal' && steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg_path"
      - name: Collect Windows and Linux packages
        if: matrix.target == 'native'
        run: node scripts/collect-packages.mjs ${{ matrix.platform }}
      - name: Collect universal macOS package
        if: matrix.platform == 'macos-universal'
        run: node scripts/collect-packages.mjs macos-universal universal-apple-darwin
      - name: Record macOS signing status
        if: matrix.platform == 'macos-universal'
        shell: bash
        run: |
          if [[ "${{ steps.macos-signing.outputs.enabled }}" == 'true' ]]; then
            printf 'signed and notarized\n' > release/macos-universal/SIGNING_STATUS.txt
          else
            printf 'unsigned\n' > release/macos-universal/SIGNING_STATUS.txt
          fi
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          deb="$(find release/${{ matrix.platform }} -maxdepth 1 -name '*.deb' -print -quit)"
          rpm="$(find release/${{ matrix.platform }} -maxdepth 1 -name '*.rpm' -print -quit)"
          dpkg-deb --info "$deb"
          rpm -qip "$rpm"
          rpm -qp --requires "$rpm"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          test "$(rpm -qp --qf '%{ARCH}' "$rpm")" = "${{ matrix.rpm_arch }}"
          (cd release/${{ matrix.platform }} && sha256sum -c SHA256SUMS-${{ matrix.platform }}.txt)
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opendock-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  install-smoke:
    name: Install smoke (${{ matrix.distro }}-${{ matrix.arch }})
    needs: packages
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            arch: x64
            runner: ubuntu-22.04
            image: debian:stable-slim
            format: deb
          - distro: fedora
            arch: x64
            runner: ubuntu-22.04
            image: fedora:latest
            format: rpm
          - distro: debian
            arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:stable-slim
            format: deb
          - distro: fedora
            arch: arm64
            runner: ubuntu-24.04-arm
            image: fedora:latest
            format: rpm
    steps:
      - name: Download Linux package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opendock-linux-${{ matrix.arch }}
          path: packages
      - name: Install and inspect DEB package
        if: matrix.format == 'deb'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates file libc-bin
          package="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          apt-get install -y "$(readlink -f "$package")"
          pkg_name="$(dpkg-deb -f "$package" Package)"
          binary="$(dpkg -L "$pkg_name" | awk '/^\/usr\/bin\/[^/]+$/ { print; exit }')"
          desktop="$(dpkg -L "$pkg_name" | awk '/^\/usr\/share\/applications\/[^/]+\.desktop$/ { print; exit }')"
          if [[ -z "$binary" || -z "$desktop" ]]; then
            echo "Could not find /usr/bin/* or a desktop file in $pkg_name"
            dpkg -L "$pkg_name"
            exit 1
          fi
          echo "binary=$binary"
          echo "desktop=$desktop"
          test -x "$binary"
          test -f "$desktop"
          file "$binary"
          ldd "$binary" > /tmp/opendock-ldd.txt 2>&1 || { cat /tmp/opendock-ldd.txt; exit 1; }
          if grep -q ' => not found' /tmp/opendock-ldd.txt; then
            cat /tmp/opendock-ldd.txt
            echo 'Missing shared libraries.'
            exit 1
          fi
          "$binary" --taskbar-guard
          echo 'DEB installed; executable, desktop file, and dynamic dependencies verified. GUI behavior not tested.'
      - name: Install and inspect RPM package
        if: matrix.format == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          package="$(find packages -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$package"
          dnf install -y file "$(readlink -f "$package")"
          binary="$(rpm -qlp "$package" | awk '/^\/usr\/bin\/[^/]+$/ { print; exit }')"
          desktop="$(rpm -qlp "$package" | awk '/^\/usr\/share\/applications\/[^/]+\.desktop$/ { print; exit }')"
          if [[ -z "$binary" || -z "$desktop" ]]; then
            echo "Could not find /usr/bin/* or a desktop file in $package"
            rpm -qlp "$package"
            exit 1
          fi
          echo "binary=$binary"
          echo "desktop=$desktop"
          test -x "$binary"
          test -f "$desktop"
          file "$binary"
          ldd "$binary" > /tmp/opendock-ldd.txt 2>&1 || { cat /tmp/opendock-ldd.txt; exit 1; }
          if grep -q ' => not found' /tmp/opendock-ldd.txt; then
            cat /tmp/opendock-ldd.txt
            echo 'Missing shared libraries.'
            exit 1
          fi
          "$binary" --taskbar-guard
          echo 'RPM installed; executable, desktop file, and dynamic dependencies verified. GUI behavior not tested.'
