name: Install Linux Tauri dependencies
description: Install the system packages required by Tauri 2 on Ubuntu runners.
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl wget file patchelf pkg-config \
          libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2 rpm